{{- /* Shared styles for all three project layouts */ -}}
<style>
.projects { margin-top: 24px; }
.ptag {
  display: inline-block; font-size: 13px; padding: 2px 10px; margin: 0 6px 6px 0;
  border-radius: 999px; background: var(--tertiary); color: var(--secondary);
}

/* ---------- shared cover placeholder ---------- */
.pcard__cover, .prow__thumb, .phero__cover { position: relative; overflow: hidden; }
.pcard__cover img, .prow__thumb img, .phero__cover img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.pcard__initial, .prow__initial, .phero__initial {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 3rem; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000));
}

/* ---------- 1. GRID ---------- */
.projects--grid {
  display: grid; gap: 24px;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
}
.pcard {
  position: relative; display: flex; flex-direction: column;
  background: var(--entry); border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow, 0 1px 3px rgba(0,0,0,.1)); transition: transform .2s ease;
}
.pcard:hover { transform: translateY(-4px); }
.pcard__link { position: absolute; inset: 0; z-index: 1; }
.pcard__cover { height: 160px; }
.pcard__body { padding: 16px 18px 20px; }
.pcard__title { margin: 0 0 8px; font-size: 20px; }
.pcard__summary { margin: 0 0 12px; color: var(--secondary); font-size: 15px; line-height: 1.5; }
.pcard__links { position: relative; z-index: 2; margin-top: 10px; }
.pcard__links a { font-size: 14px; margin-right: 14px; text-decoration: underline; }

/* ---------- 2. HERO (alternating) ---------- */
.projects--hero { display: flex; flex-direction: column; gap: 56px; }
.phero { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: center; }
.phero--rev .phero__cover { order: 2; }
.phero__cover { height: 300px; border-radius: var(--radius); }
.phero__title { margin: 0 0 12px; font-size: 28px; }
.phero__summary { color: var(--secondary); font-size: 16px; line-height: 1.6; margin: 0 0 16px; }
.phero__links { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.phero__cta { font-weight: 600; }
.phero__links a { text-decoration: underline; }
@media (max-width: 680px) {
  .phero { grid-template-columns: 1fr; }
  .phero--rev .phero__cover { order: 0; }
}

/* ---------- 3. LIST + THUMB ---------- */
.projects--listthumb { display: flex; flex-direction: column; }
.prow {
  position: relative; display: flex; gap: 18px; align-items: center;
  padding: 18px 0; border-bottom: 1px solid var(--border);
}
.prow__link { position: absolute; inset: 0; }
.prow__thumb {
  flex: 0 0 90px; width: 90px; height: 90px; border-radius: var(--radius);
}
.prow__body { flex: 1 1 auto; }
.prow__title { margin: 0 0 6px; font-size: 20px; }
.prow__summary { margin: 0; color: var(--secondary); font-size: 15px; }
.prow__tags { flex: 0 0 auto; text-align: right; max-width: 40%; }
@media (max-width: 680px) {
  .prow__tags { display: none; }
}
</style>
